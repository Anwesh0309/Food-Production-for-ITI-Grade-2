<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Food Production SkillLab — Bilingual digital learning platform for the Food Production (General) trade" />
    <meta name="theme-color" content="#ea580c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Food Production SkillLab</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('foodproduction-skilllab-storage') || '{}');
        if (s.state && s.state.theme === 'dark') document.documentElement.classList.add('dark');
        var manual = sessionStorage.getItem('foodproduction:manual-lang');
        document.documentElement.lang = manual === 'en' ? 'en' : 'hi';
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
